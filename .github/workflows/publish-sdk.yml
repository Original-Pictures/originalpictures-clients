name: Publish SDK

# Publishes one client package to its public registry. Adapted from the private
# source repository's publish workflow for this public mirror.
#
# Deliberately manual or tag-only, never on pull_request or branch push: a release
# is an owner decision. A manual run is a dry run unless `dry_run` is unticked. A
# tag push always publishes, and the tag's version must equal the package's
# declared version. A manual real publish must run from main.
#
# `package: all` is a dry run of every publishable package at once (job
# `dry-run-all`): it builds the Python distributions and the npm tarballs, runs
# `twine check --strict` and `npm publish --dry-run`, and never holds a publish
# credential.
#
# Build and publish are separate jobs. The build jobs run repository code with no
# secret and no OIDC permission. Each package has its own publish job behind its
# own environment (required reviewers); only a publish job can mint the registry
# OIDC token, and it runs no repository code: it downloads the built artifact and
# uploads it.
#
# @originalpictures/disclosure builds standalone here since the source repository's
# PR #204: without the private packages/domain, its committed assets/policy copy is
# the source, and the monorepo test that keeps that copy equal to packages/domain is
# skipped outside the monorepo.
#
# One test reads a file that exists only in the private source repository (the
# design-token build behind the tests/tokens.test.ts of @originalpictures/verify and
# @originalpictures/disclosure); it is excluded below by name and runs in the source repository's CI. The committed
# OpenAPI document and the A2A agent card the other cross-checks read are exported
# here at the paths those tests expect.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build (and publish unless dry run); all = dry run of every package"
        required: true
        type: choice
        options:
          - all
          - mcp-scopes
          - sdk-python
          - cli-python
          - mcp
          - disclosure-python
          - sdk-typescript
          - verify
          - disclosure
      dry_run:
        description: "Build, test and verify only; publish nothing"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "mcp-scopes-v*"
      - "sdk-python-v*"
      - "cli-v*"
      - "mcp-v*"
      - "disclosure-python-v*"
      - "sdk-ts-v*"
      - "verify-v*"
      - "disclosure-v*"

permissions:
  contents: read

concurrency:
  group: publish-sdk-${{ github.ref }}-${{ inputs.package || github.ref_name }}
  cancel-in-progress: false

env:
  # Pinned to the repository's declared toolchain (.nvmrc / .python-version).
  NODE_VERSION: "24.18.0"
  PYTHON_VERSION: "3.12.13"

jobs:
  dry-run-all:
    name: Dry run every package (build, twine check, npm pack; never publishes)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No job-level permissions: it inherits the workflow's contents: read and can
    # never mint a registry OIDC token.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Build and check the Python distributions
        run: |
          set -euo pipefail
          uv lock --check
          for distribution in originalpictures-mcp-scopes originalpictures-sdk originalpictures-cli originalpictures-mcp originalpictures-disclosure; do
            uv build --package "${distribution}" --out-dir "dist/${distribution}"
          done
          uv run --no-project --with twine==6.1.0 twine check --strict dist/*/*
          python3 - <<'PY'
          import email.parser, pathlib, tomllib, zipfile
          directories = {
              "originalpictures-mcp-scopes": "packages/mcp-scopes",
              "originalpictures-sdk": "packages/sdk-python",
              "originalpictures-cli": "packages/cli-python",
              "originalpictures-mcp": "packages/mcp",
              "originalpictures-disclosure": "packages/disclosure-python",
          }
          for distribution, directory in directories.items():
              project = tomllib.load(open(f"{directory}/pyproject.toml", "rb"))["project"]
              (wheel,) = pathlib.Path("dist", distribution).glob("*.whl")
              with zipfile.ZipFile(wheel) as archive:
                  name = next(n for n in archive.namelist() if n.endswith(".dist-info/METADATA"))
                  metadata = email.parser.Parser().parsestr(archive.read(name).decode())
              assert metadata["Name"] == distribution, metadata["Name"]
              assert metadata["Version"] == project["version"], metadata["Version"]
              print(f"{distribution} {metadata['Version']}: metadata OK")
          PY
      - name: Check the MCP registry manifest matches the package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, tomllib
          server = json.load(open("packages/mcp/server.json"))
          project = tomllib.load(open("packages/mcp/pyproject.toml", "rb"))["project"]
          (package,) = server["packages"]
          # The registry entry has its own version; only the package pin follows pyproject.
          assert package["version"] == project["version"], "version drift"
          assert package["identifier"] == project["name"], "identifier drift"
          assert len(server["description"]) <= 100, "registry description too long"
          print("server.json OK")
          PY
      - name: Build, pack and check the npm packages
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          mkdir -p "${GITHUB_WORKSPACE}/npm-dist"
          for directory in packages/sdk-typescript packages/verify-embed packages/disclosure; do
            name="$(jq -r .name "${directory}/package.json")"
            pnpm --filter "${name}" run build
            (cd "${directory}" && pnpm pack --pack-destination "${GITHUB_WORKSPACE}/npm-dist")
          done
          for tarball in "${GITHUB_WORKSPACE}"/npm-dist/*.tgz; do
            node .github/scripts/check-packed-manifest.mjs "${tarball}"
            # An absolute path: npm reads a bare "dir/file.tgz" as a GitHub shorthand.
            npm publish "${tarball}" --dry-run --access public
          done
      - name: Summary
        run: |
          {
            echo "Dry run of every package: built and checked, nothing published."
            ls -1 dist/*/* npm-dist/*
          } >> "${GITHUB_STEP_SUMMARY}"

  resolve:
    name: Resolve package, version and mode
    if: ${{ github.event_name == 'push' || inputs.package != 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      package: ${{ steps.resolve.outputs.package }}
      directory: ${{ steps.resolve.outputs.directory }}
      distribution: ${{ steps.resolve.outputs.distribution }}
      registry: ${{ steps.resolve.outputs.registry }}
      version: ${{ steps.resolve.outputs.version }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Resolve and refuse a mismatched or unsafe release
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "push" ]]; then
            # Longest prefix first: mcp-scopes-v must not be read as mcp-v.
            case "${REF_NAME}" in
              mcp-scopes-v*) package=mcp-scopes; tag_version="${REF_NAME#mcp-scopes-v}" ;;
              sdk-python-v*) package=sdk-python; tag_version="${REF_NAME#sdk-python-v}" ;;
              cli-v*) package=cli-python; tag_version="${REF_NAME#cli-v}" ;;
              mcp-v*) package=mcp; tag_version="${REF_NAME#mcp-v}" ;;
              disclosure-python-v*) package=disclosure-python; tag_version="${REF_NAME#disclosure-python-v}" ;;
              sdk-ts-v*) package=sdk-typescript; tag_version="${REF_NAME#sdk-ts-v}" ;;
              verify-v*) package=verify; tag_version="${REF_NAME#verify-v}" ;;
              disclosure-v*) package=disclosure; tag_version="${REF_NAME#disclosure-v}" ;;
              *) echo "::error::unrecognised release tag ${REF_NAME}"; exit 1 ;;
            esac
            dry_run=false
          else
            package="${INPUT_PACKAGE}"
            tag_version=""
            dry_run="${INPUT_DRY_RUN}"
          fi
          case "${package}" in
            mcp-scopes) directory=packages/mcp-scopes; registry=pypi ;;
            sdk-python) directory=packages/sdk-python; registry=pypi ;;
            cli-python) directory=packages/cli-python; registry=pypi ;;
            mcp) directory=packages/mcp; registry=pypi ;;
            disclosure-python) directory=packages/disclosure-python; registry=pypi ;;
            sdk-typescript) directory=packages/sdk-typescript; registry=npm ;;
            verify) directory=packages/verify-embed; registry=npm ;;
            disclosure) directory=packages/disclosure; registry=npm ;;
            *) echo "::error::unknown package ${package}"; exit 1 ;;
          esac
          if [[ "${registry}" == "pypi" ]]; then
            read -r distribution version < <(python3 -c 'import sys, tomllib; p = tomllib.load(open(sys.argv[1], "rb"))["project"]; print(p["name"], p["version"])' "${directory}/pyproject.toml")
          else
            distribution="$(jq -r .name "${directory}/package.json")"
            version="$(jq -r .version "${directory}/package.json")"
          fi
          if [[ -n "${tag_version}" && "${tag_version}" != "${version}" ]]; then
            echo "::error::tag ${REF_NAME} names ${tag_version}, but ${directory} declares ${version}"
            exit 1
          fi
          if [[ "${dry_run}" == "false" && "${EVENT_NAME}" != "push" && "${GIT_REF}" != "refs/heads/main" ]]; then
            echo "::error::a manual real publish must run from main (got ${GIT_REF})"
            exit 1
          fi
          {
            echo "package=${package}"
            echo "directory=${directory}"
            echo "distribution=${distribution}"
            echo "registry=${registry}"
            echo "version=${version}"
            echo "dry_run=${dry_run}"
          } >> "${GITHUB_OUTPUT}"
          echo "${distribution} ${version} -> ${registry} (dry_run=${dry_run})" >> "${GITHUB_STEP_SUMMARY}"

  build-python:
    name: Build and verify the Python distribution
    needs: resolve
    if: ${{ needs.resolve.outputs.registry == 'pypi' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DIRECTORY: ${{ needs.resolve.outputs.directory }}
      DISTRIBUTION: ${{ needs.resolve.outputs.distribution }}
      VERSION: ${{ needs.resolve.outputs.version }}
      DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install
        run: uv sync --all-packages --all-groups --frozen
      - name: Test
        run: |
          set -euo pipefail
          if [[ -d "${DIRECTORY}/tests" ]]; then
            uv run --frozen --package "${DISTRIBUTION}" pytest "${DIRECTORY}"
          else
            echo "${DIRECTORY} has no tests directory"
          fi
      - name: Build
        run: uv build --package "${DISTRIBUTION}" --out-dir dist
      - name: Verify the built metadata
        run: |
          set -euo pipefail
          uv run --no-project --with twine==6.1.0 twine check --strict dist/*
          python3 - <<'PY'
          import email.parser, os, pathlib, zipfile
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as wheel:
              name = next(n for n in wheel.namelist() if n.endswith(".dist-info/METADATA"))
              metadata = email.parser.Parser().parsestr(wheel.read(name).decode())
          assert metadata["Name"] == os.environ["DISTRIBUTION"], metadata["Name"]
          assert metadata["Version"] == os.environ["VERSION"], metadata["Version"]
          PY
      - name: Refuse a version PyPI already has, or first-party pins it lacks
        # A wheel pinning an unpublished first-party release (originalpictures-mcp
        # pins originalpictures-mcp-scopes and originalpictures-sdk) installs for no one.
        run: |
          set -euo pipefail
          status() { curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$1/$2/json"; }
          problems=0
          if [[ "$(status "${DISTRIBUTION}" "${VERSION}")" == "200" ]]; then
            echo "::error::${DISTRIBUTION} ${VERSION} is already on PyPI"; problems=1
          fi
          while read -r pin; do
            [[ -z "${pin}" ]] && continue
            if [[ "$(status "${pin%%==*}" "${pin##*==}")" != "200" ]]; then
              echo "::error::dependency ${pin} is not on PyPI; publish it first"; problems=1
            fi
          done < <(python3 -c 'import sys, tomllib; [print(d.replace(" ", "")) for d in tomllib.load(open(sys.argv[1], "rb"))["project"].get("dependencies", []) if d.startswith("originalpictures-")]' "${DIRECTORY}/pyproject.toml")
          if [[ "${problems}" != "0" ]]; then
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "::warning::a real publish would be refused for the reasons above"
            else
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # One PyPI publish job per distribution, each behind its own environment, so a
  # PyPI trusted publisher can be bound to exactly one (workflow, environment) pair.
  # The steps are identical; only the guard and the environment differ.

  publish-pypi-mcp-scopes:
    name: Publish originalpictures-mcp-scopes to PyPI
    needs: [resolve, build-python]
    if: ${{ needs.resolve.outputs.distribution == 'originalpictures-mcp-scopes' && needs.resolve.outputs.dry_run == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi-mcp-scopes
      url: https://pypi.org/project/originalpictures-mcp-scopes/${{ needs.resolve.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  publish-pypi-sdk:
    name: Publish originalpictures-sdk to PyPI
    needs: [resolve, build-python]
    if: ${{ needs.resolve.outputs.distribution == 'originalpictures-sdk' && needs.resolve.outputs.dry_run == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi-sdk
      url: https://pypi.org/project/originalpictures-sdk/${{ needs.resolve.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  publish-pypi-cli:
    name: Publish originalpictures-cli to PyPI
    needs: [resolve, build-python]
    if: ${{ needs.resolve.outputs.distribution == 'originalpictures-cli' && needs.resolve.outputs.dry_run == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi-cli
      url: https://pypi.org/project/originalpictures-cli/${{ needs.resolve.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  publish-pypi-mcp:
    name: Publish originalpictures-mcp to PyPI
    needs: [resolve, build-python]
    if: ${{ needs.resolve.outputs.distribution == 'originalpictures-mcp' && needs.resolve.outputs.dry_run == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi-mcp
      url: https://pypi.org/project/originalpictures-mcp/${{ needs.resolve.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  publish-pypi-disclosure:
    name: Publish originalpictures-disclosure to PyPI
    needs: [resolve, build-python]
    if: ${{ needs.resolve.outputs.distribution == 'originalpictures-disclosure' && needs.resolve.outputs.dry_run == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi-disclosure
      url: https://pypi.org/project/originalpictures-disclosure/${{ needs.resolve.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  build-npm:
    name: Build, test and pack the npm package
    needs: resolve
    if: ${{ needs.resolve.outputs.registry == 'npm' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PACKAGE: ${{ needs.resolve.outputs.package }}
      DIRECTORY: ${{ needs.resolve.outputs.directory }}
      DISTRIBUTION: ${{ needs.resolve.outputs.distribution }}
      VERSION: ${{ needs.resolve.outputs.version }}
      DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # The SDK's shared-fixture test spawns `uv run python tests/fixtures/developer_surfaces.py`.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          uv sync --all-packages --all-groups --frozen
      - name: Build and test
        run: |
          set -euo pipefail
          case "${PACKAGE}" in
            # tests/tokens.test.ts (in verify and disclosure) compares against the
            # design-token build, which only the private source repository has.
            verify | disclosure)
              pnpm --filter "${DISTRIBUTION}" run build
              (cd "${DIRECTORY}" && pnpm exec vitest run --exclude tests/tokens.test.ts)
              ;;
            *) pnpm --filter "${DISTRIBUTION}" test ;;
          esac
      - name: Pack
        # pnpm pack rewrites workspace: ranges; npm publish of the directory would not.
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/npm-dist"
          (cd "${DIRECTORY}" && pnpm pack --pack-destination "${GITHUB_WORKSPACE}/npm-dist")
          ls -l npm-dist
      - name: Verify the packed manifest and the registry
        run: |
          set -euo pipefail
          tarballs=("${GITHUB_WORKSPACE}"/npm-dist/*.tgz)
          test "${#tarballs[@]}" -eq 1
          tarball="${tarballs[0]}"
          manifest="$(tar -xOzf "${tarball}" package/package.json)"
          test "$(jq -r .name <<<"${manifest}")" = "${DISTRIBUTION}"
          test "$(jq -r .version <<<"${manifest}")" = "${VERSION}"
          node .github/scripts/check-packed-manifest.mjs "${tarball}"
          # An absolute path: npm reads a bare "dir/file.tgz" as a GitHub shorthand.
          npm publish "${tarball}" --dry-run --access public
          if npm view "${DISTRIBUTION}@${VERSION}" version >/dev/null 2>&1; then
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "::warning::${DISTRIBUTION}@${VERSION} is already on npm; a real publish would be refused"
            else
              echo "::error::${DISTRIBUTION}@${VERSION} is already on npm"; exit 1
            fi
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-dist
          path: npm-dist/
          if-no-files-found: error
          retention-days: 7

  # One npm publish job per package. All three use the `release` environment.

  publish-npm-sdk:
    name: Publish @originalpictures/sdk to npm
    needs: [resolve, build-npm]
    if: ${{ needs.resolve.outputs.distribution == '@originalpictures/sdk' && needs.resolve.outputs.dry_run == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: release
      url: https://www.npmjs.com/package/@originalpictures/sdk/v/${{ needs.resolve.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-dist
          path: npm-dist/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Publish
        env:
          # npm prefers trusted publishing (OIDC) when it is configured for the
          # package and falls back to this token, which the first publish needs.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EXPECTED_NAME: "@originalpictures/sdk"
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          if [[ "$(printf '%s\n' 11.5.1 "${npm_version}" | sort -V | head -1)" != "11.5.1" ]]; then
            echo "::error::npm ${npm_version} predates trusted publishing (11.5.1)"; exit 1
          fi
          tarballs=("${GITHUB_WORKSPACE}"/npm-dist/*.tgz)
          test "${#tarballs[@]}" -eq 1
          test "$(tar -xOzf "${tarballs[0]}" package/package.json | jq -r .name)" = "${EXPECTED_NAME}"
          # This repository is public, so npm provenance is always requested.
          npm publish "${tarballs[0]}" --access public --provenance

  publish-npm-verify:
    name: Publish @originalpictures/verify to npm
    needs: [resolve, build-npm]
    if: ${{ needs.resolve.outputs.distribution == '@originalpictures/verify' && needs.resolve.outputs.dry_run == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: release
      url: https://www.npmjs.com/package/@originalpictures/verify/v/${{ needs.resolve.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-dist
          path: npm-dist/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Publish
        env:
          # npm prefers trusted publishing (OIDC) when it is configured for the
          # package and falls back to this token, which the first publish needs.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EXPECTED_NAME: "@originalpictures/verify"
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          if [[ "$(printf '%s\n' 11.5.1 "${npm_version}" | sort -V | head -1)" != "11.5.1" ]]; then
            echo "::error::npm ${npm_version} predates trusted publishing (11.5.1)"; exit 1
          fi
          tarballs=("${GITHUB_WORKSPACE}"/npm-dist/*.tgz)
          test "${#tarballs[@]}" -eq 1
          test "$(tar -xOzf "${tarballs[0]}" package/package.json | jq -r .name)" = "${EXPECTED_NAME}"
          # This repository is public, so npm provenance is always requested.
          npm publish "${tarballs[0]}" --access public --provenance

