      x-op-contract-audience: public-system
  /v1/public/verify-pages/{slug}/checks:
    post:
      description: 'Unauthenticated. Check one file against this page: its Content Credentials and, if
        the page owner opted in, recovery against the owner''s own assets only. 200 with a completed result,
        or 202 while it runs. Accepts any origin. Limited per client network (an IPv6 /64 counts as one)
        and per page across all clients.'
      operationId: createPublicCheck
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          pattern: ^[a-z0-9](?:[a-z0-9-]{1,46})[a-z0-9]$
          title: Slug
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  description: The file to check, at most 25 MB. It is held only for the check, never
                    stored with the result and never logged.
                  format: binary
                  type: string
              required:
              - file
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCheckResponse'
          description: Successful Response
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCheckResponse'
          description: The check is still running (state running); poll check_id.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'VERIFY_PAGE_NOT_FOUND: no enabled page has this slug.'
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'MEDIA_COMPRESSED_SIZE_LIMIT: the file is larger than 25 MB.'
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'PUBLIC_CHECK_MEDIA_UNSUPPORTED: a public check does not run this media type (video/mp4
            today); the message lists the types it accepts. Nothing is staged or billed.'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'VERIFY_PAGE_INVALID: the slug is malformed or the body is not multipart/form-data
            with one file part; or a MEDIA_* reason: the file''s format cannot be checked (the message
            lists the accepted types).'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'PUBLIC_CHECK_RATE_LIMITED: too many checks from this network for this page, or
            for this page from all networks together. PUBLIC_CHECK_MONTHLY_LIMIT_REACHED: the page has
            answered its monthly allowance (the owner''s monthly_check_limit or the platform default)
            and resumes next UTC month. Retryable after Retry-After seconds.'
          headers:
            Retry-After:
              description: Whole seconds to wait before checking again.
              required: true
              schema:
                type: string
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Verification is temporarily unavailable.
      summary: Check one file's declared origin against a verify page, IP rate-limited.
      tags:
      - verify-pages
      x-op-contract-audience: public-system
