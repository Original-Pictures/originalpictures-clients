            maxItems: 64
            minItems: 1
            type: array
          - type: 'null'
          title: Allowed Recipes
        allowed_watermark_algorithms:
          anyOf:
          - items:
              type: string
            maxItems: 64
            minItems: 1
            type: array
          - type: 'null'
          title: Allowed Watermark Algorithms
        allowed_watermark_strengths:
          anyOf:
          - items:
              enum:
              - subtle
              - balanced
              - robust
              type: string
            maxItems: 3
            minItems: 1
            type: array
          - type: 'null'
          title: Allowed Watermark Strengths
        default_fingerprint_algorithms:
          anyOf:
          - items:
              type: string
            maxItems: 64
            minItems: 1
            type: array
          - type: 'null'
          title: Default Fingerprint Algorithms
        default_recipe:
