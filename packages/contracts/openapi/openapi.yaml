        allowed_origins:
          anyOf:
          - description: 'Publishable disclosure keys only (scope disclosure:write alone): the sites,
              as browser origins scheme://host[:port] with no path, that may use the key. https://*.example.com
              covers every subdomain of example.com but not example.com itself. A request whose Origin
              header is missing or names another site is refused with 403 `API_KEY_ORIGIN_NOT_ALLOWED`.
