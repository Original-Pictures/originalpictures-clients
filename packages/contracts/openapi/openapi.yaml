            that finished in any other state.
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        fingerprint:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether the job's recipe computes fingerprints. Null only for a recipe outside
            the system catalogue.
          title: Fingerprint
        job_id:
          description: Asynchronous Sign job identifier; poll this resource until terminal.
          pattern: ^job_[a-z2-7]{16}$
          title: Job Id
          type: string
        media_inspection:
          anyOf:
          - $ref: '#/components/schemas/NormalizedInspectionFacts'
