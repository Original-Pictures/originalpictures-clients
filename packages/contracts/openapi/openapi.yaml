    AssetRetentionClassResponse:
      additionalProperties: false
      description: One data class's deletion deadline, because they genuinely differ.
      properties:
        data_class:
          description: 'The retention class these objects share, decided by their role: raw_upload, work,
            signed_output, manifest, receipt or audit.'
          minLength: 1
          title: Data Class
          type: string
        delete_after:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the soonest object in this class is deleted, or null when every object in
            it is retained indefinitely. Null is a fact, not a gap.
          title: Delete After
        is_indefinite:
          description: True when no object in this class has a deletion deadline.
          title: Is Indefinite
          type: boolean
        object_count:
          description: Objects in this class for this asset.
          exclusiveMinimum: 0.0
          title: Object Count
          type: integer
      required:
      - data_class
      - object_count
      - is_indefinite
      title: AssetRetentionClassResponse
      type: object
    AssetRetentionResponse:
      additionalProperties: false
      description: 'When this asset''s stored objects are deleted, reported per object.


        Retention belongs to the **object**, not the asset: one asset holds a raw upload

        with a deadline beside a signed output without one. There is therefore no single

        date that is true of the asset, and this deliberately does not offer one.

        ``soonest_delete_after`` is the first thing to go; ``indefinite_object_count`` is

        what tells you the asset does not disappear then.'
      properties:
        classes:
          description: One entry per retention class present on this asset.
          items:
            $ref: '#/components/schemas/AssetRetentionClassResponse'
          title: Classes
          type: array
        indefinite_object_count:
          description: How many of those objects outlive every deadline above. When this is greater than
            zero, deleting at soonest_delete_after does not remove the asset.
          minimum: 0.0
          title: Indefinite Object Count
          type: integer
        latest_delete_after:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: The latest deadline across objects that have one.
          title: Latest Delete After
        object_count:
          description: Objects carrying a retention pin.
          exclusiveMinimum: 0.0
          title: Object Count
          type: integer
        soonest_delete_after:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: The earliest deletion deadline across this asset's objects, or null when every
            object is retained indefinitely.
          title: Soonest Delete After
      required:
      - object_count
      - indefinite_object_count
      - classes
      title: AssetRetentionResponse
      type: object
