        progress:
          $ref: '#/components/schemas/JobProgressResponse'
        recipe_id:
          description: 'The recipe the job runs: the one named, or the one watermark and fingerprint resolved
            to (C2PA-only routing and the express lane may name a peer).'
          title: Recipe Id
          type: string
        recipe_version:
          title: Recipe Version
          type: integer
        result:
          anyOf:
          - $ref: '#/components/schemas/JobResultResponse'
          - type: 'null'
          description: Present only for completed Sign jobs; never a polling snapshot.
        state:
          $ref: '#/components/schemas/JobState'
          description: Sign lifecycle. completed implies result is present and result.verification_id
            is immutable evidence readable immediately; nonterminal states do not expose result.
        steps:
