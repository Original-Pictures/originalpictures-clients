              a single host. Host bits and /0 are refused. Accepted only when the deployment can trust
              the client address (see `API_KEY_IP_ALLOWLIST_UNAVAILABLE`).
            items:
              maxLength: 64
              minLength: 1
              type: string
            maxItems: 32
            minItems: 1
