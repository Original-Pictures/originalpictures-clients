      type: object
    ImageProfileResponse:
      additionalProperties: false
      properties:
        accepted_auxiliaries:
          description: Auxiliary planes accepted today, such as alpha. Empty for any profile that is not
            available.
          items:
            type: string
          title: Accepted Auxiliaries
          type: array
        accepted_bit_depths:
          description: 'The public promise: bit depths this profile accepts today. Empty for any profile
            that is not available.'
          items:
            type: integer
          title: Accepted Bit Depths
          type: array
        availability:
          description: available means uploads of this profile execute today. reviewed_unavailable means
            the profile has been assessed and is deliberately not executable, with a reason. unreviewed
            means no assessment has been made; it is never a statement of support.
          enum:
          - unreviewed
          - reviewed_unavailable
          - available
          title: Availability
          type: string
        color_class:
          description: Dynamic-range class of the profile.
          enum:
          - sdr
          - hdr
          title: Color Class
          type: string
        limits_are_provisional:
          description: True while limits are derived from a small measured sample and may tighten. They
            are always enforced; provisional describes their confidence, not their effect.
          title: Limits Are Provisional
          type: boolean
        max_compressed_bytes:
          description: Largest encoded object this profile's limits allow. A profile that is not available
            accepts nothing, whatever its limits.
          minimum: 1.0
          title: Max Compressed Bytes
          type: integer
        max_height:
          description: Largest height this profile's limits allow.
          minimum: 1.0
          title: Max Height
          type: integer
        max_pixels:
          description: Largest pixel count this profile's limits allow.
          minimum: 1.0
          title: Max Pixels
          type: integer
        max_width:
          description: Largest width this profile's limits allow.
          minimum: 1.0
          title: Max Width
          type: integer
        media_format:
          description: IANA media type this profile describes.
          title: Media Format
          type: string
        planned_auxiliaries:
          description: Auxiliary planes the format plan proposes. A plan, not a promise.
          items:
            type: string
          title: Planned Auxiliaries
          type: array
        planned_bit_depths:
          description: Bit depths the format plan proposes. A plan, not a promise, and never a statement
            that the profile accepts them.
          items:
            type: integer
          title: Planned Bit Depths
          type: array
        profile_id:
          description: Stable image profile identifier, e.g. png.sdr.8.v1.
          title: Profile Id
          type: string
        profile_version:
          description: Immutable version of this profile's contract.
          title: Profile Version
          type: string
        recipes:
          description: The recipes an available profile exposes. Every available profile exposes exactly
            Sign, Watermark, and Watermark + Sign; a profile that cannot offer all three is not available
            at all, so this is never a partial list.
          items:
            type: string
          title: Recipes
          type: array
        unavailable_reason:
          description: Why a reviewed profile is not executable. Empty for an available profile.
          title: Unavailable Reason
          type: string
      required:
      - profile_id
      - media_format
      - profile_version
      - color_class
      - availability
      - recipes
      - accepted_bit_depths
      - accepted_auxiliaries
      - planned_bit_depths
      - planned_auxiliaries
      - max_compressed_bytes
      - max_pixels
      - max_width
      - max_height
      - limits_are_provisional
      - unavailable_reason
      title: ImageProfileResponse
      type: object
