    SignRequest:
      additionalProperties: false
      properties:
        ai_declaration:
          anyOf:
          - $ref: '#/components/schemas/AiDeclarationRequest'
          - type: 'null'
          description: 'Declare that this asset was produced with a generative model. The manifest then
            records c2pa.created with the digital source type you state, instead of c2pa.opened. Requires
            a sign-only recipe: watermark false.'
        asset_id:
          description: Tenant-visible ast_ asset identifier; never an immutable aob_ object ID.
          pattern: ^ast_[a-z2-7]{16}$
          title: Asset Id
          type: string
        creator_id:
          anyOf:
          - pattern: ^crid_[a-z2-7]{16}$
            type: string
          - type: 'null'
          description: Optional enrolled creator to attribute this output to. The manifest carries only
            an opaque reference and a commitment, never the creator's name or email address.
          title: Creator Id
        fingerprint:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Also compute perceptual fingerprints, kept server-side so a copy of the file can
            be matched later. Omitted means false when recipe_id is omitted. With recipe_id, it must agree
            with that recipe.
          title: Fingerprint
        fingerprint_algorithms:
          anyOf:
          - items:
              enum:
              - audfprint
              - chromaprint
              - dinov2
              - dinov2-lsh256
              - iscc-audio
              - iscc-image
              - pdq
              - tmk-pdqf
              - vpdq
              type: string
            maxItems: 9
            type: array
          - type: 'null'
          description: 'The fingerprints to compute as server-side recovery signals. Omit it to use the
            default set GET /v1/capabilities reports for the asset''s media type. A list replaces that
            set: name each fingerprint once, at least one, all offered for the media type. A locked fingerprint
            (ISCC Image-Code for images) is always added, because it is the soft binding the manifest
            carries. The default applies only to new jobs: an admitted job keeps the set it was admitted
            with.'
          title: Fingerprint Algorithms
        identity:
          anyOf:
          - $ref: '#/components/schemas/SignIdentityRequest'
          - type: 'null'
          description: 'Add a CAWG identity assertion signed with an enrolled identity credential. Not
            available yet: until an identity certificate is enrolled the request is refused with 409 IDENTITY_CREDENTIAL_NOT_ENROLLED.'
        mode:
          anyOf:
          - enum:
            - standard
            - express
            type: string
          - type: 'null'
          description: 'express runs a JPEG, PNG, WebP, TIFF or AVIF image on the express lane -- the
            same watermark, fingerprint and C2PA manifest as rcp_system_watermark_then_sign, run as one
            uninterrupted job -- and waits for it: the response is 200 with the completed job and a download
            link, or 202 with the job as usual if it has not finished within the wait (webhooks are delivered
            either way). It applies to watermark and fingerprint both true, rcp_system_watermark_then_sign
            and rcp_system_express_watermark_then_sign; any other choice or media type runs on the ordinary
            pipeline and answers 202. standard, or omitting the field, is the ordinary asynchronous request.'
          title: Mode
        recipe_id:
          anyOf:
          - pattern: ^rcp_[a-z0-9_]{3,64}$
            type: string
          - type: 'null'
          description: 'Advanced: the exact recipe to run (GET /v1/recipes), needed only for a sidecar
            format. Most requests set watermark and fingerprint instead. Required when neither flag is
            sent, unless the calling API key has legacy defaults (a signing profile) naming a default
            recipe. Sent together with a flag, the flag must agree with the recipe or the request is refused.'
          title: Recipe Id
        template_id:
          anyOf:
          - pattern: ^wft_[a-z2-7]{16}$
            type: string
          - type: 'null'
          description: A saved workflow template (POST /v1/workflow-templates) to fill in the fields this
            request omits. A field sent in the request, even as null, wins over the template's; objects
            such as ai_declaration are replaced whole. An unknown or foreign template is refused with
            404 WORKFLOW_TEMPLATE_NOT_FOUND.
          title: Template Id
        watermark:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Embed an invisible watermark before signing. Every request signs the file with
            a C2PA manifest; this adds a recovery signal carried in the pixels or samples rather than
            in metadata. Omitted means false when recipe_id is omitted. With recipe_id, it must agree
            with that recipe.
          title: Watermark
        watermark_algorithm:
          anyOf:
          - enum:
            - audioseal
            - audioseal-mm02-4
            - pixelseal
            - pixelseal-video
            - trustmark-b
            - trustmark-c
            - trustmark-p
            - trustmark-q
            - videoseal
            - videoseal-image
            type: string
          - type: 'null'
          description: 'The invisible watermark to embed, for a watermark recipe. Omit it to use the default
            GET /v1/capabilities reports for the asset''s media type. It must be one of the algorithms
            listed there for that media type; a sign-only recipe refuses it. The default applies only
            to new jobs: an admitted job keeps the watermark it was admitted with. Name trustmark-q to
            keep the TrustMark Q watermark on any image media type.'
          title: Watermark Algorithm
        watermark_strength:
          anyOf:
          - enum:
            - subtle
            - balanced
            - robust
            type: string
          - type: 'null'
          description: How hard the watermark may be embedded, for a watermark recipe. subtle embeds at
            the algorithm's lowest qualified strength only and refuses the job rather than make it stronger;
            balanced is the default (omit the field for the same result); robust allows the full qualified
            ladder. GET /v1/capabilities lists the exact strengths each level allows for each algorithm.
            A sign-only recipe refuses it. An admitted job keeps the strength it was admitted with.
          title: Watermark Strength
      required:
      - asset_id
      title: SignRequest
      type: object
