    ApiKeySigningProfileDocument:
      additionalProperties: false
      description: 'Defaults and allowed sets for POST /v1/sign made with this key.


        Every field is optional. A default fills a POST /v1/sign field the request omits; a

        field the request names always wins. An allowed set refuses, with

        `API_KEY_PROFILE_FORBIDS`, a request whose recipe, media type, watermark, strength

        or fingerprints would fall outside it -- judged on what the job would actually run,

        so an omitted field cannot pass by falling through to a system default. Omit a field

        (or send null) for no default or no restriction. Names come from GET /v1/recipes and

        GET /v1/capabilities.'
