components:
  schemas:
    AbortUploadResponse:
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/UploadStatus'
        upload_id:
          title: Upload Id
          type: string
      required:
      - upload_id
      - status
      title: AbortUploadResponse
      type: object
    AiActionResponse:
      additionalProperties: false
      properties:
        description:
          title: Description
          type: string
        id:
          title: Id
          type: string
        kind:
          enum:
          - copy
          - deep_link
          title: Kind
          type: string
        label:
          title: Label
          type: string
        maximum_prompt_characters:
          anyOf:
          - type: integer
          - type: 'null'
          title: Maximum Prompt Characters
        over_limit_fallback_action_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Over Limit Fallback Action Id
        target:
          enum:
          - clipboard
          - cursor
          - claude
          - chatgpt
          title: Target
          type: string
        url_template:
          anyOf:
          - type: string
          - type: 'null'
          title: Url Template
      required:
      - id
      - label
      - description
      - kind
      - target
      - url_template
      - maximum_prompt_characters
      - over_limit_fallback_action_id
      title: AiActionResponse
      type: object
    AiDeclarationRequest:
      additionalProperties: false
      description: 'A declaration that this asset was produced with a generative model.


        Supplying one changes the manifest''s inception action from ``c2pa.opened`` to

        ``c2pa.created`` and records the source type with it, which is what the C2PA

        Specification requires of a generated asset. It is therefore a statement about how

        the asset was made, recorded as made by *you*: ``software_agent`` is your own

        description of your software, which we cannot verify and do not warrant.


        Only the three generative source types are accepted. ``humanEdits`` is not a

        declaration of AI generation and would take a human-authored asset down the

        generated path, so it is refused rather than quietly recorded.'
      properties:
        digital_source_type:
          description: 'The IPTC digital source type, by suffix: trainedAlgorithmicMedia for output created
            entirely by a model, compositeWithTrainedAlgorithmicMedia for generative augmentation of existing
            media, compositeSynthetic for a composite with at least one generative element.'
          enum:
          - trainedAlgorithmicMedia
          - compositeWithTrainedAlgorithmicMedia
          - compositeSynthetic
          title: Digital Source Type
          type: string
        human_oversight_level:
          anyOf:
          - enum:
            - human-in-the-loop
            - human-on-the-loop
            - human-out-of-the-loop
            type: string
          - type: 'null'
          description: Specification 18.28.3. It lives inside the model-disclosure assertion, so it requires
            at least one disclosed model; sending one without is refused rather than silently dropped.
          title: Human Oversight Level
        models:
          items:
            $ref: '#/components/schemas/AiModelDisclosureRequest'
          maxItems: 8
          title: Models
          type: array
        software_agent_name:
          description: The generating system, as you name it. Recorded as your statement.
          maxLength: 128
          minLength: 1
          title: Software Agent Name
          type: string
        software_agent_version:
          anyOf:
          - maxLength: 64
            minLength: 1
            type: string
          - type: 'null'
          title: Software Agent Version
      required:
      - digital_source_type
      - software_agent_name
      title: AiDeclarationRequest
      type: object
    AiDeclaredSigningReceiptEvidenceResponse:
      additionalProperties: false
      description: 'A sign-only publication whose manifest declares the asset AI-generated.


        ``op.signing-receipt.ai-declared.v1`` is a peer of ``op.signing-receipt.v2``, not a

        version of it. The manifest''s inception is ``c2pa.created`` with no parent ingredient,

        so there is no ``prior_provenance`` to report; ``ai_declaration`` states the declaration

        instead. Every other block is the same evidence in the same shape.'
      properties:
        ai_declaration:
          $ref: '#/components/schemas/ReceiptAiDeclarationResponse'
        asset_id:
          title: Asset Id
          type: string
        bindings:
          anyOf:
          - $ref: '#/components/schemas/ReceiptBindingSetResponse'
          - $ref: '#/components/schemas/SidecarReceiptBindingSetResponse'
          title: Bindings
        job_id:
          title: Job Id
          type: string
        manifest:
          $ref: '#/components/schemas/ReceiptManifestResponse'
        output:
          $ref: '#/components/schemas/ReceiptOutputResponse'
        product:
          $ref: '#/components/schemas/ReceiptProductResponse'
        published_at:
          title: Published At
          type: string
        schema_version:
          const: op.signing-receipt.ai-declared.v1
          title: Schema Version
          type: string
        signing:
          $ref: '#/components/schemas/ReceiptSigningResponse'
        validation:
          $ref: '#/components/schemas/ReceiptValidationResponse'
      required:
      - schema_version
      - product
      - job_id
      - asset_id
      - output
      - manifest
      - signing
      - validation
      - bindings
      - ai_declaration
      - published_at
      title: AiDeclaredSigningReceiptEvidenceResponse
      type: object
    AiMarkBlock:
      additionalProperties: false
      properties:
        declaration:
          $ref: '#/components/schemas/AiDeclarationRequest'
          description: Sent as ai_declaration.
        type:
          const: ai_mark
          title: Type
          type: string
      required:
      - type
      - declaration
      title: AiMarkBlock
      type: object
    AiModelDisclosureRequest:
      additionalProperties: false
      description: One entry of the ``ai-model-disclosure-map`` in Specification 18.28.
      properties:
        name:
          description: The model's name.
          maxLength: 128
          minLength: 1
          title: Name
          type: string
        scientific_domain:
          anyOf:
          - maxLength: 32
            minLength: 2
            type: string
          - type: 'null'
          description: An arXiv taxonomy category, which the Specification requires this field to conform
            to -- for example cs.CV or physics.optics.
          title: Scientific Domain
        version:
          anyOf:
          - maxLength: 64
            minLength: 1
            type: string
          - type: 'null'
          title: Version
      required:
      - name
      title: AiModelDisclosureRequest
      type: object
    AiPromptResponse:
      additionalProperties: false
      properties:
        credential_environment_variable:
          title: Credential Environment Variable
          type: string
        id:
          title: Id
          type: string
        secret_substitution_allowed:
          title: Secret Substitution Allowed
          type: boolean
        section_order:
          items:
            type: string
          title: Section Order
          type: array
        template_id:
          title: Template Id
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - template_id
      - credential_environment_variable
      - section_order
      - secret_substitution_allowed
      title: AiPromptResponse
      type: object
    ApiKeyCreateRequest:
      additionalProperties: false
      description: 'Issue a key from an explicit scope list, or from a server-resolved ``preset``.


        Exactly one of ``scopes`` and ``preset`` is sent. A key that names no ``expires_at``

        never expires, whichever of the two it sends; an explicit ``expires_at`` is honoured.

        A preset key is named after its preset when ``name`` is omitted; a ``scopes`` request

        is unchanged from before presets existed.'
      properties:
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 'When the key stops working. Omitted: never, for every request. Keys issued before
            2026-10-19 from the full_access preset keep the 90-day expiry they were issued with.'
          title: Expires At
        name:
          anyOf:
          - maxLength: 100
            minLength: 1
            type: string
          - type: 'null'
          title: Name
        preset:
          anyOf:
          - $ref: '#/components/schemas/ApiKeyPreset'
          - type: 'null'
          description: Let the server choose the grants. full_access is every customer scope except credential
            and governance administration, payment sessions, creator personal data and enrolment, and
            trusted-capture enrolment; publishable_disclosure is disclosure:write only, for a key embedded
            in a web page. Resolved against the live scope vocabulary at issuance; the response lists
            the scopes granted.
        restrictions:
          anyOf:
          - $ref: '#/components/schemas/ApiKeyRestrictionsRequest'
          - type: 'null'
        retention_mode:
          anyOf:
          - enum:
            - 1h
            - 24h
            - 72h
            - retain
            type: string
          - type: 'null'
          title: Retention Mode
        scopes:
          anyOf:
          - items:
              type: string
            maxItems: 32
            minItems: 1
            type: array
          - type: 'null'
          description: The exact grants, from GET /v1/api-keys/scopes. Send this or preset, not both.
          title: Scopes
        signing_profile:
          anyOf:
          - $ref: '#/components/schemas/ApiKeySigningProfileDocument'
          - type: 'null'
          description: 'Legacy key defaults: what POST /v1/sign does for this key when a request sends
            no watermark or fingerprint flag. Still honoured; new keys should send the flags in each request
            instead.'
      title: ApiKeyCreateRequest
      type: object
    ApiKeyListResponse:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: '#/components/schemas/ApiKeyMetadataResponse'
          title: Data
          type: array
      required:
      - data
      title: ApiKeyListResponse
      type: object
    ApiKeyMetadataResponse:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        display_hint:
          title: Display Hint
          type: string
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        id:
          title: Id
          type: string
        last_used_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Used At
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        restrictions:
          anyOf:
          - $ref: '#/components/schemas/ApiKeyRestrictionsView'
          - type: 'null'
        revoked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Revoked At
        rotated_from_id:
          anyOf:
          - type: string
          - type: 'null'
