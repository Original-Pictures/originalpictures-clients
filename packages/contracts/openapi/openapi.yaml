    WorkspaceGovernanceResponse:
      additionalProperties: false
      description: 'Tenant-wide governance constraining every item on this page.


        Separate from each item''s own ``governance`` because it is a different

        claim: a row states what is true of that asset, this states what is true of

        the workspace. A row can hold an available preview while a workspace hold

        means delivery refuses, and a surface that showed only the row would leave

        the reader with a false expectation.'
      properties:
        deletion_state:
          anyOf:
          - $ref: '#/components/schemas/AssetDeletionState'
          - type: 'null'
        legal_hold_active:
          title: Legal Hold Active
          type: boolean
      required:
      - deletion_state
      - legal_hold_active
      title: WorkspaceGovernanceResponse
      type: object
  securitySchemes:
    bearerAuth:
      description: Either a Clerk session JWT, verified locally against the pinned dashboard public key,
        or a scoped API key of the form `opk_{lookup}.{secret}`. The credential shape selects the transport;
        API keys additionally require the scope its operation declares.
      scheme: bearer
      type: http
    clerkWebhookSignature:
      description: Svix signature over the exact raw request body. The signed envelope also requires the
        svix-id and svix-timestamp headers.
      in: header
      name: svix-signature
      type: apiKey
    stripeWebhookSignature:
      description: Stripe timestamped v1 HMAC signature over the exact raw request body.
      in: header
      name: Stripe-Signature
      type: apiKey
