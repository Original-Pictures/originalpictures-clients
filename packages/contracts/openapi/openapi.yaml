    SidecarManifestResponse:
      additionalProperties: false
      description: 'The `.c2pa` capability beside an asset whose manifest is not embedded.


        Present when the asset''s manifest travels beside it rather than inside it:

        the sidecar lane, whose formats `GET /v1/capabilities` lists. A caller

        receiving this must fetch both: the manifest alone proves nothing without the

        bytes it binds, and the bytes alone carry no provenance at all.'
      properties:
        byte_length:
          description: Immutable byte length of the exact manifest.
          exclusiveMinimum: 0.0
          title: Byte Length
          type: integer
        expires_at:
          title: Expires At
          type: string
        filename:
          description: The name to save the manifest under. It is the asset's own download filename plus
            '.c2pa', so a caller can keep the pair together without reconstructing it.
          minLength: 1
          title: Filename
          type: string
        headers:
          additionalProperties:
            type: string
          title: Headers
          type: object
        media_type:
          const: application/c2pa
          title: Media Type
          type: string
        method:
          const: GET
          title: Method
          type: string
        sha256:
          description: Lowercase SHA-256 of the exact manifest bytes.
          pattern: ^[0-9a-f]{64}$
          title: Sha256
          type: string
        storage_version_sha256:
          title: Storage Version Sha256
          type: string
        url:
          title: Url
          type: string
      required:
      - method
      - url
      - headers
      - expires_at
      - media_type
      - byte_length
      - sha256
      - storage_version_sha256
      - filename
      title: SidecarManifestResponse
      type: object
    SidecarReceiptBindingSetResponse:
      additionalProperties: false
      description: 'A binding set with exactly one candidate: the hard hash of the exact bytes.


        ``ReceiptBindingSetResponse`` requires ``candidate_count`` between 2 and 6 because every

        lane that decodes its media publishes a hard hash *and* at least one soft binding --

        ISCC plus the job''s selected descriptors for an image, a fingerprint for audio or

        video. A sidecar pair

        (``op.signing-receipt.sidecar.v1``) and a container signed by the structural sign-only

        recipe (``op.signing-receipt.v2``) publish the hard hash and nothing else: nothing

        decoded them, and no registered soft-binding algorithm is scoped to them.


        So this is one candidate, exactly, and ``types`` is exactly ``["hard_hash"]``. Pinned

        rather than loosened: a receipt claiming a soft binding would be claiming an algorithm

        that does not exist for its container.'
      properties:
        binding_set_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Binding Set Sha256
          type: string
        candidate_count:
          const: 1
          title: Candidate Count
          type: integer
        schema_version:
          const: op.publication-binding-set.v1
          title: Schema Version
          type: string
        types:
          items:
            const: hard_hash
            type: string
          maxItems: 1
          minItems: 1
          title: Types
          type: array
      required:
      - schema_version
      - candidate_count
      - binding_set_sha256
      - types
      title: SidecarReceiptBindingSetResponse
      type: object
    SidecarReceiptManifestResponse:
      additionalProperties: false
      description: 'The manifest block of a sidecar pair''s receipt.


        No ``active_label_sha256``: a sidecar manifest''s label lives inside the separate

        ``application/c2pa`` object and the private signing seam does not report it, so the plan

        carries none. Instead this block names **where the manifest is** -- the object''s public id

        and digest -- which the embedded shape has no field for and which a reader needs, because

        a pair is only meaningful together.'
      properties:
        claim_plan_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Claim Plan Sha256
          type: string
        manifest_id:
          title: Manifest Id
          type: string
        manifest_store_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Manifest Store Sha256
          type: string
        sidecar_object_id:
          minLength: 1
          title: Sidecar Object Id
          type: string
        sidecar_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Sidecar Sha256
          type: string
      required:
      - manifest_id
      - claim_plan_sha256
      - manifest_store_sha256
      - sidecar_object_id
      - sidecar_sha256
      title: SidecarReceiptManifestResponse
      type: object
    SidecarSigningReceiptEvidenceResponse:
      additionalProperties: false
      description: 'A sidecar pair''s publication receipt, ``op.signing-receipt.sidecar.v1``.


        A peer of ``op.signing-receipt.v2`` and not a version of it. Its manifest block names

        the separate ``application/c2pa`` object rather than an active label. It carries

        ``prior_provenance`` only when the asset arrived with an embedded credential that was

        chained as the new manifest''s parent; otherwise the key is absent, as it always was.

        Everything else is the same evidence in the same shape, because the same signing seam

        produced it.'
      properties:
        asset_id:
          title: Asset Id
          type: string
        bindings:
          $ref: '#/components/schemas/SidecarReceiptBindingSetResponse'
        job_id:
          title: Job Id
          type: string
        manifest:
          $ref: '#/components/schemas/SidecarReceiptManifestResponse'
        output:
          $ref: '#/components/schemas/ReceiptOutputResponse'
        prior_provenance:
          anyOf:
          - $ref: '#/components/schemas/ReceiptPriorProvenanceResponse'
          - type: 'null'
        product:
          $ref: '#/components/schemas/ReceiptProductResponse'
        published_at:
          title: Published At
          type: string
        schema_version:
          const: op.signing-receipt.sidecar.v1
          title: Schema Version
          type: string
        signing:
          $ref: '#/components/schemas/ReceiptSigningResponse'
        validation:
          $ref: '#/components/schemas/ReceiptValidationResponse'
      required:
      - schema_version
      - product
      - job_id
      - asset_id
      - output
      - manifest
      - signing
      - validation
      - bindings
      - published_at
      title: SidecarSigningReceiptEvidenceResponse
      type: object
    SignBatchItemResponse:
