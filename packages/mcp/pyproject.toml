[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "originalpictures-mcp"
version = "0.1.1"
description = "Sign media with C2PA Content Credentials and verify its declared origin."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Original Pictures Technologies, Inc.", email = "hello@originalpictures.com" }]
keywords = [
  "c2pa",
  "content-credentials",
  "provenance",
  "ai-watermarking",
  "invisible-watermark",
  "watermarking",
  "verification",
  "eu-ai-act",
  "ai-labeling",
  "mcp",
  "model-context-protocol",
  "ai-agents",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia",
  "Topic :: Security :: Cryptography",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4.5",
  "fastmcp==3.4.10",
  "originalpictures-mcp-scopes==1.0.0",
  "originalpictures-sdk==1.0.0",
]

[project.urls]
Homepage = "https://originalpictures.com"
Documentation = "https://docs.originalpictures.com/integrations/mcp-remote/"
Repository = "https://github.com/Original-Pictures/originalpictures-clients"
Issues = "https://github.com/Original-Pictures/originalpictures-clients/issues"
Pricing = "https://originalpictures.com/pricing/"

[project.scripts]
originalpictures-mcp = "originalpictures_mcp.cli:main"

# The sdist ships what the wheel is built from. Tests read monorepo fixtures and
# would not run from an extracted sdist.
[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/originalpictures_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["../../"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]
"tests/test_transports.py" = ["S603"]
