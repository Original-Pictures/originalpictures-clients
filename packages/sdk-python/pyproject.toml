[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "originalpictures-sdk"
version = "1.0.0"
description = "Python SDK for C2PA Content Credentials: sign, invisibly watermark, fingerprint and verify media."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Original Pictures Technologies, Inc.", email = "hello@originalpictures.com" }]
keywords = [
  "c2pa",
  "content-credentials",
  "provenance",
  "ai-watermarking",
  "invisible-watermark",
  "watermarking",
  "fingerprinting",
  "perceptual-hash",
  "verification",
  "eu-ai-act",
  "sb-942",
  "ai-labeling",
  "sdk",
  "api-client",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Video",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx==0.28.1"]

[project.urls]
Homepage = "https://originalpictures.com"
Documentation = "https://docs.originalpictures.com/sdk/python/"
Repository = "https://github.com/Original-Pictures/originalpictures-clients"
Issues = "https://github.com/Original-Pictures/originalpictures-clients/issues"
Pricing = "https://originalpictures.com/pricing/"

# The sdist ships what the wheel is built from. Tests read monorepo fixtures and
# would not run from an extracted sdist.
[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/originalpictures"]
